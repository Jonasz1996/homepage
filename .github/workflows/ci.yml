name: CI

on:
  push:
    branches: [main, nieuwste]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Elke Python-versie met de PostgreSQL van de Debian-versie die ze meebrengt, zoals install.sh ze installeert:
    # Debian 12 heeft Python 3.11 en PostgreSQL 15, Debian 13 Python 3.13 en PostgreSQL 17. Telkens gewoon
    # PostgreSQL, en PostgreSQL met de nieuwste TimescaleDB voor die versie. SQLite (geen server, alleen voor de
    # ontwikkeling) maar op één van de twee: op 3.13 lopen alle tests al twee keer. Zo duurt de CI ongeveer even lang
    # als met één PostgreSQL-versie. Elke kant loopt helemaal uit, ook als de andere faalt: zo zie je of het aan de
    # versie ligt.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.11", pg: "15", sqlite: true}
          - {python: "3.13", pg: "17", sqlite: false}
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homepage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      # Zoals in productie: PostgreSQL met TimescaleDB (hypertables, compressie, bewaarbeleid).
      timescale:
        image: timescale/timescaledb:latest-pg${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homepage_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Dezelfde vaste versies als install.sh in productie, plus pytest; de backend zelf wordt niet geïnstalleerd.
      - name: Bibliotheken uit requirements(-dev).lock
        run: pip install --no-deps -r requirements-dev.lock && pip check
      # Zou pip voor pyproject.toml nog iets anders installeren dan de backend zelf, dan ontbreekt het in de lock.
      - name: Lock volledig voor pyproject.toml
        run: |
          pip install --dry-run --quiet --report /tmp/lock.json ".[dev]"
          python - <<'EOF'
          import json, sys
          meer = [f"{i['metadata']['name']}=={i['metadata']['version']}" for i in json.load(open("/tmp/lock.json"))["install"]
                  if i["metadata"]["name"] != "homepage"]
          sys.exit(f"Niet (of met een andere versie) in requirements(-dev).lock: {meer}" if meer else 0)
          EOF
      # pg_dump en pg_restore van dezelfde versie als de server, zoals in de container: de test van de back-up
      # (tests/test_backuptest.py) draait de scripts uit deploy/ echt. Uit de apt-bron van PostgreSQL zelf.
      - name: PostgreSQL-client ${{ matrix.pg }}
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-${{ matrix.pg }}
          echo "/usr/lib/postgresql/${{ matrix.pg }}/bin" >> "$GITHUB_PATH"
      - name: Versies
        run: |
          psql -h localhost -p 5432 -XAtc "SELECT version()"
          psql -h localhost -p 5433 -XAtc "SELECT version()" \
            -c "SELECT 'TimescaleDB ' || default_version FROM pg_available_extensions WHERE name = 'timescaledb'"
          pg_dump --version
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: homepage_test
      - name: Migraties
        run: alembic upgrade head && alembic check
        env:
          HOMEPAGE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/homepage_test
      - name: Tests (SQLite)
        if: matrix.sqlite
        run: pytest -q
      # Met HOMEPAGE_TEST_PG_CLIENT=verplicht slaat de test van de back-up niet over als pg_dump ontbreekt: dan faalt hij.
      - name: Tests (PostgreSQL ${{ matrix.pg }})
        run: pytest -q
        env:
          HOMEPAGE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/homepage_test
          HOMEPAGE_TEST_PG_CLIENT: verplicht
      - name: Tests (TimescaleDB op PostgreSQL ${{ matrix.pg }}, schema uit de migraties)
        run: pytest -q
        env:
          HOMEPAGE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/homepage_test
          HOMEPAGE_TEST_SCHEMA: migraties
          HOMEPAGE_TEST_PG_CLIENT: verplicht

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homepage
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HOMEPAGE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/homepage
      HOMEPAGE_SECRET_KEY_FILE: /tmp/hp/secret.key
      HOMEPAGE_SETUP_TOKEN_FILE: /tmp/hp/setup-token
      HOMEPAGE_SETUP_TOKEN: e2e-setup-token
      HOMEPAGE_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Backend starten
        run: |
          mkdir -p /tmp/hp
          echo "$HOMEPAGE_SETUP_TOKEN" > /tmp/hp/setup-token
          pip install -q --no-deps -r backend/requirements.lock
          python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" > /tmp/hp/secret.key
          cd backend && alembic upgrade head
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/hp/api.log 2>&1 &
          for _ in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:8000/api/ping && break; sleep 1; done
      - run: npm ci
        working-directory: frontend
      - name: Browsertests (Playwright)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Log van de API
        if: failure()
        run: cat /tmp/hp/api.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/*.sh
