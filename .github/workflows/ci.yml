name: CI

on:
  push:
    branches: [main, nieuwste]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Elke Python-versie met de PostgreSQL van de Debian-versie die ze meebrengt, zoals install.sh ze installeert:
    # Debian 12 heeft Python 3.11 en PostgreSQL 15, Debian 13 Python 3.13 en PostgreSQL 17. Telkens gewoon
    # PostgreSQL, en PostgreSQL met de nieuwste TimescaleDB voor die versie. SQLite (geen server, alleen voor de
    # ontwikkeling) maar op één van de twee: op 3.13 lopen alle tests al twee keer. Zo duurt de CI ongeveer even lang
    # als met één PostgreSQL-versie. Elke kant loopt helemaal uit, ook als de andere faalt: zo zie je of het aan de
    # versie ligt.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.11", pg: "15", sqlite: true}
          - {python: "3.13", pg: "17", sqlite: false}
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homepage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      # Zoals in productie: PostgreSQL met TimescaleDB (hypertables, compressie, bewaarbeleid).
      timescale:
        image: timescale/timescaledb:latest-pg${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homepage_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Dezelfde vaste versies als install.sh in productie, plus pytest; de backend zelf wordt niet geïnstalleerd.
      - name: Bibliotheken uit requirements(-dev).lock
        run: pip install --no-deps -r requirements-dev.lock && pip check
      # Zou pip voor pyproject.toml nog iets anders installeren dan de backend zelf, dan ontbreekt het in de lock.
      - name: Lock volledig voor pyproject.toml
        run: |
          pip install --dry-run --quiet --report /tmp/lock.json ".[dev]"
          python - <<'EOF'
          import json, sys
          meer = [f"{i['metadata']['name']}=={i['metadata']['version']}" for i in json.load(open("/tmp/lock.json"))["install"]
                  if i["metadata"]["name"] != "homepage"]
          sys.exit(f"Niet (of met een andere versie) in requirements(-dev).lock: {meer}" if meer else 0)
          EOF
      # pg_dump en pg_restore van dezelfde versie als de server, zoals in de container: de test van de back-up
      # (tests/test_backuptest.py) draait de scripts uit deploy/ echt. Uit de apt-bron van PostgreSQL zelf.
      - name: PostgreSQL-client ${{ matrix.pg }}
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-${{ matrix.pg }}
          echo "/usr/lib/postgresql/${{ matrix.pg }}/bin" >> "$GITHUB_PATH"
      - name: Versies
        run: |
          psql -h localhost -p 5432 -XAtc "SELECT version()"
          psql -h localhost -p 5433 -XAtc "SELECT version()" \
            -c "SELECT 'TimescaleDB ' || default_version FROM pg_available_extensions WHERE name = 'timescaledb'"
          pg_dump --version
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: homepage_test
      - name: Migraties
        run: alembic upgrade head && alembic check
        env:
          HOMEPAGE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/homepage_test
      - name: Tests (SQLite)
        if: matrix.sqlite
        run: pytest -q
      # Met HOMEPAGE_TEST_PG_CLIENT=verplicht slaat de test van de back-up niet over als pg_dump ontbreekt: dan faalt hij.
      - name: Tests (PostgreSQL ${{ matrix.pg }})
        run: pytest -q
        env:
          HOMEPAGE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/homepage_test
          HOMEPAGE_TEST_PG_CLIENT: verplicht
      - name: Tests (TimescaleDB op PostgreSQL ${{ matrix.pg }}, schema uit de migraties)
        run: pytest -q
        env:
          HOMEPAGE_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/homepage_test
          HOMEPAGE_TEST_SCHEMA: migraties
          HOMEPAGE_TEST_PG_CLIENT: verplicht

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      # Losse functies zoals de Markdown van de notities (node --test, zonder extra pakketten).
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homepage
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HOMEPAGE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/homepage
      HOMEPAGE_SECRET_KEY_FILE: /tmp/hp/secret.key
      HOMEPAGE_SETUP_TOKEN_FILE: /tmp/hp/setup-token
      HOMEPAGE_SETUP_TOKEN: e2e-setup-token
      HOMEPAGE_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Backend starten
        run: |
          mkdir -p /tmp/hp
          echo "$HOMEPAGE_SETUP_TOKEN" > /tmp/hp/setup-token
          pip install -q --no-deps -r backend/requirements.lock
          python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" > /tmp/hp/secret.key
          cd backend && alembic upgrade head
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/hp/api.log 2>&1 &
          for _ in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:8000/api/ping && break; sleep 1; done
      - run: npm ci
        working-directory: frontend
      - name: Browsertests (Playwright)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Log van de API
        if: failure()
        run: cat /tmp/hp/api.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck deploy/*.sh
      # De nginx-configuratie zoals install.sh ze invult (dezelfde sed), in een eigen map op poort 8080 (https: 8443,
      # met het certificaat van certificaat uit install.sh) met een nep-API op 18000. Afzenders op lo: NPM (een adres dat niet privé is: mag dus alleen als NPM), een toestel op het LAN,
      # het eigen LAN-adres van de container, een publiek IP en een publiek IP in een netwerk dat install.sh als LAN
      # invult (het IPv6-netwerk van de container, HOMEPAGE_LAN_NETS). Wie wat mag: zie $homepage_blocked in
      # nginx-map.conf.
      - name: nginx-configuratie en wie er rechtstreeks bij mag
        run: |
          command -v nginx >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q nginx; }
          NPM_IP=192.0.2.10 LAN=192.168.77.2 SELF=192.168.77.1 PUB=203.0.113.9 EXTRA=198.51.100.7
          for a in $NPM_IP $LAN $SELF $PUB $EXTRA; do sudo ip addr replace "$a/32" dev lo; done
          d=$(mktemp -d) && chmod 755 "$d"
          mkdir -p "$d/dist" "$d/snippets" "$d/api/api/push" "$d/api/api/hooks" "$d/tmp"
          echo app > "$d/dist/index.html"
          for p in healthz outside push/x hooks/x; do echo api > "$d/api/api/$p"; done
          python3 -m http.server 18000 --bind 127.0.0.1 --directory "$d/api" >/dev/null 2>&1 &
          for _ in $(seq 50); do curl -fso /dev/null http://127.0.0.1:18000/ && break; sleep 0.1; done
          # Het certificaat zoals install.sh het maakt.
          eval "$(sed -n '/^certificaat_past() {/,/^}/p; /^certificaat_zetten() {/,/^}/p; /^certificaat() {/,/^}/p' \
            deploy/install.sh)"
          TLS_DIR=$d/ssl TLS_TMPFS=/dev/shm
          certificaat || { echo "::error::certificaat: $TLS_FOUT"; exit 1; }
          cat > "$d/nginx.conf" <<EOF
          pid $d/nginx.pid;
          error_log $d/error.log;
          events {}
          http {
              access_log off;
              client_body_temp_path $d/tmp/body;
              proxy_temp_path $d/tmp/proxy;
              fastcgi_temp_path $d/tmp/fastcgi;
              uwsgi_temp_path $d/tmp/uwsgi;
              scgi_temp_path $d/tmp/scgi;
              include $d/homepage-map.conf;
              include $d/homepage.conf;
          }
          EOF
          ngx() { nginx -e "$d/error.log" -p "$d" -c "$d/nginx.conf" "$@"; }
          start() {  # $1: wat install.sh invult voor __LAN_DICHT__ (0 met HOMEPAGE_LAN_OPEN=1), $2 voor __LAN_NETS__
            NPM_IP_RE="${NPM_IP//./\\\\.}"
            sed "s/__NPM_IP_RE__/$NPM_IP_RE/; s/__LAN_DICHT__/$1/; s#__LAN_NETS__#${2:-}#" deploy/nginx-map.conf \
              > "$d/homepage-map.conf"
            cp deploy/nginx-headers.conf "$d/snippets/homepage-headers.conf"
            sed "s/listen 443 /listen 8443 /; s/listen \[::\]:443 /listen [::]:8443 /; s#/etc/ssl/homepage#$d/ssl#" \
              deploy/nginx-tls.conf > "$d/snippets/homepage-tls.conf"
            sed "s/__NPM_IP__/$NPM_IP/; s/listen 80 /listen 8080 /; s/listen \[::\]:80 /listen [::]:8080 /;
              s#127.0.0.1:8000#127.0.0.1:18000#; s#/var/log/nginx/#$d/#; s#/opt/homepage/frontend/dist#$d/dist#;
              s#/etc/ssl/homepage#$d/ssl#" deploy/nginx.conf > "$d/homepage.conf"
            [ -e /proc/net/if_inet6 ] || sed -i '/listen \[::\]/d' "$d/homepage.conf" "$d/snippets/homepage-tls.conf"
            [ ! -e "$d/nginx.pid" ] || { ngx -s stop; while [ -e "$d/nginx.pid" ]; do sleep 0.1; done; }
            ngx -t -q
            ngx
            for _ in $(seq 50); do curl -so /dev/null "http://$SELF:8080/" && break; sleep 0.1; done
          }
          fout=0
          check() {  # afzender pad verwachte-status [https]; met XFF=adres: de bezoeker die NPM doorgeeft
            local naar=$SELF got url h=()
            [ "$1" != 127.0.0.1 ] || naar=127.0.0.1
            url="http://$naar:8080$2"
            [ -z "${4:-}" ] || url="https://localhost:8443$2"
            [ -z "${XFF:-}" ] || h=(-H "X-Forwarded-For: $XFF")
            got=$(curl -s --path-as-is -o "$d/body" -w '%{http_code}' --interface "$1" "${h[@]}" \
              --cacert "$d/ssl/homepage-ca.crt" --resolve "localhost:8443:$naar" "$url")
            echo "van $1 naar $2${4:+ (https)}: $got"
            if [ "$got" != "$3" ]; then echo "::error::van $1 naar $2${4:+ (https)}: $got, verwacht $3"; fout=1; fi
          }
          start 1 "198.51.100.0/24 lan; 2001:db8:1::/48 lan; "
          for p in / /api/outside /api/healthz /api/push/x; do
            check 127.0.0.1 "$p" 200; check "$NPM_IP" "$p" 200; check "$SELF" "$p" 200
          done
          for p in /api/healthz /api/push/x /api/hooks/x /api/healthz?x=1; do check "$LAN" "$p" 200; done
          for p in / /index.html /api/outside /api/healthz/ /api/push/../outside /api/push/%2e%2e/outside //api/outside; do
            check "$LAN" "$p" 403
          done
          check "$LAN" / 403
          for w in HOMEPAGE_LAN_OPEN HOMEPAGE_NPM_IP HOMEPAGE_LAN_NETS "kwam van $LAN"; do
            grep -q "$w" "$d/body" || { echo "::error::geen uitleg bij de 403 ($w)"; fout=1; }
          done
          for p in / /api/healthz /api/push/x /api/hooks/x; do check "$PUB" "$p" 403; done
          # https: dezelfde regels, en de CA om te downloaden (alleen thuis: van het LAN via NPM, niet van buitenaf).
          for p in / /api/outside; do check "$NPM_IP" "$p" 200 https; done
          XFF=192.168.1.5 check "$NPM_IP" /homepage-ca.crt 200 https
          cmp -s "$d/body" "$d/ssl/homepage-ca.crt" || { echo "::error::/homepage-ca.crt is niet de CA"; fout=1; }
          XFF=203.0.113.9 check "$NPM_IP" /homepage-ca.crt 404 https
          check "$LAN" /api/healthz 200 https; check "$LAN" /api/outside 403 https; check "$PUB" / 403 https
          # Een publiek IP in een netwerk dat install.sh als LAN invult: net als het LAN.
          for p in /api/healthz /api/push/x /api/hooks/x; do check "$EXTRA" "$p" 200; done
          for p in / /api/outside; do check "$EXTRA" "$p" 403; done
          # HOMEPAGE_LAN_OPEN=1: het LAN mag alles, een publiek IP nog altijd niets. Zonder extra netwerken is EXTRA
          # gewoon een publiek IP.
          start 0
          for p in / /api/outside /api/healthz; do
            check "$LAN" "$p" 200; check "$PUB" "$p" 403; check "$EXTRA" "$p" 403
          done
          ngx -s stop
          exit "$fout"
