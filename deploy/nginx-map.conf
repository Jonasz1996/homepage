# /etc/nginx/conf.d/homepage-map.conf
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Achter Cloudflare is het IP dat NPM doorgeeft dat van Cloudflare. Cloudflare zet het echte
# bezoekers-IP in CF-Connecting-IP; die header geloven we alleen als het verzoek van NPM komt.
map "$realip_remote_addr|$http_cf_connecting_ip" $homepage_client_ip {
    "~^__NPM_IP_RE__\|(?<cf>[0-9A-Fa-f.:]+)$" $cf;
    default $remote_addr;
}

# Land van de bezoeker (CF-IPCountry van Cloudflare), voor het sessie-overzicht. Zelfde regel: alleen via NPM.
map "$realip_remote_addr|$http_cf_ipcountry" $homepage_country {
    "~^__NPM_IP_RE__\|(?<cc>[A-Za-z]{2})$" $cc;
    default "";
}

# Kwam het verzoek via Cloudflare (NPM gaf een CF-Connecting-IP door)? Dan is het een bezoek van buitenaf.
map "$realip_remote_addr|$http_cf_connecting_ip" $homepage_via_cf {
    "~^__NPM_IP_RE__\|[0-9A-Fa-f.:]+$" 1;
    default "";
}

# Stond er een slot voor het dashboard? Cloudflare Access stuurt Cf-Access-Jwt-Assertion mee, de forward-auth van
# Authentik in NPM X-authentik-username. Alleen geloofd als het verzoek van NPM komt; het dashboard toont het in net.
map "$realip_remote_addr|$http_cf_access_jwt_assertion|$http_x_authentik_username" $homepage_access {
    "~^__NPM_IP_RE__\|[^|]+\|" cloudflare-access;
    "~^__NPM_IP_RE__\|\|[^|]+$" authentik;
    default "";
}
