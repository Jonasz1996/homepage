# /etc/nginx/conf.d/homepage-map.conf
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Achter Cloudflare is het IP dat NPM doorgeeft dat van Cloudflare. Cloudflare zet het echte
# bezoekers-IP in CF-Connecting-IP; die header geloven we alleen als het verzoek van NPM komt.
map "$realip_remote_addr|$http_cf_connecting_ip" $homepage_client_ip {
    "~^__NPM_IP_RE__\|(?<cf>[0-9A-Fa-f.:]+)$" $cf;
    default $remote_addr;
}

# Land van de bezoeker (CF-IPCountry van Cloudflare), voor het sessie-overzicht. Zelfde regel: alleen via NPM.
map "$realip_remote_addr|$http_cf_ipcountry" $homepage_country {
    "~^__NPM_IP_RE__\|(?<cc>[A-Za-z]{2})$" $cc;
    default "";
}
