# /etc/nginx/conf.d/homepage-map.conf
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Van wie kreeg NPM het verzoek? NPM zet dat adres achteraan in X-Forwarded-For, en set_real_ip_from in de site
# maakt er $remote_addr van. Via de proxy van Cloudflare (poortdoorverwijzing) is dat een adres van Cloudflare, via
# een Cloudflare Tunnel het privé-adres van cloudflared (op de host van NPM: 127.0.0.1, het Docker-netwerk of het
# LAN-adres van NPM zelf). Wie rechtstreeks van het internet bij NPM komt, kan daar alleen zijn eigen publieke IP
# tonen: dan zijn de CF-headers vervalst.
# NPM gelooft zelf X-Real-IP van privé-adressen, Cloudflare en CloudFront, en zet dan dát adres achteraan. Een
# toestel op het LAN kan zo een adres van Cloudflare voorwenden (geeft niets: wie op het LAN zit, is toch thuis) of
# een willekeurig publiek IP (dan telt het als vervalst, met dat IP). Cloudflare en CloudFront halen een X-Real-IP
# van de bezoeker weg; alleen een Worker kan er een meesturen. Wie dat ook wil uitsluiten: zie de README
# (Installeren → Cloudflare, set_real_ip_from in NPM).
# Bron: https://www.cloudflare.com/ips-v4 en https://www.cloudflare.com/ips-v6. Bijwerken: vervang de twee lijsten
# hieronder door wat daar staat, in de repository (een lokale wijziging op de server verdwijnt bij de volgende
# update; install.sh zet dit bestand dan opnieuw in /etc/nginx/conf.d). Ontbreekt er een nieuw blok van Cloudflare,
# dan telt een bezoek via dat blok als vervalst: van buitenaf, met een melding.
geo $remote_addr $homepage_cf_peer {
    default 0;

    # Cloudflare, IPv4
    173.245.48.0/20  1;
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    141.101.64.0/18  1;
    108.162.192.0/18 1;
    190.93.240.0/20  1;
    188.114.96.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
    162.158.0.0/15   1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    172.64.0.0/13    1;
    131.0.72.0/22    1;

    # Cloudflare, IPv6
    2400:cb00::/32   1;
    2606:4700::/32   1;
    2803:f800::/32   1;
    2405:b500::/32   1;
    2405:8100::/32   1;
    2a06:98c0::/29   1;
    2c0f:f248::/32   1;

    # Niet publiek: een Cloudflare Tunnel (cloudflared in een CT of op de host van NPM)
    127.0.0.0/8      1;
    10.0.0.0/8       1;
    172.16.0.0/12    1;
    192.168.0.0/16   1;
    100.64.0.0/10    1;
    ::1/128          1;
    fc00::/7         1;
    fe80::/10        1;
}

# Kwam het verzoek van NPM? (install.sh vult het IP van NPM in.)
map $realip_remote_addr $homepage_from_npm {
    "~^__NPM_IP_RE__$" 1;
    default 0;
}

# De headers van Cloudflare (CF-Connecting-IP, CF-IPCountry, Cf-Access-Jwt-Assertion) geloven we alleen als het
# verzoek van NPM komt en NPM het van Cloudflare of een tunnel kreeg.
map "$homepage_from_npm$homepage_cf_peer" $homepage_cf_trusted {
    11 1;
    default 0;
}

# Achter Cloudflare is het IP dat NPM doorgeeft dat van Cloudflare. Cloudflare zet het echte bezoekers-IP in
# CF-Connecting-IP. Anders (of een waarde die geen IP is): het adres waarvan NPM het verzoek kreeg.
map "$homepage_cf_trusted|$http_cf_connecting_ip" $homepage_client_ip {
    "~^1\|(?<cf>[0-9]{1,3}(\.[0-9]{1,3}){3}|[0-9A-Fa-f]*:[0-9A-Fa-f:.]+)$" $cf;
    default $remote_addr;
}

# Land van de bezoeker (CF-IPCountry van Cloudflare), voor het sessie-overzicht.
map "$homepage_cf_trusted|$http_cf_ipcountry" $homepage_country {
    "~^1\|(?<cc>[A-Za-z]{2})$" $cc;
    default "";
}

# Kwam het verzoek via Cloudflare? Dan is het een bezoek van buitenaf.
map "$homepage_cf_trusted|$http_cf_connecting_ip" $homepage_via_cf {
    "~^1\|." 1;
    default "";
}

# Een header van Cloudflare die niet van Cloudflare komt: iemand die NPM rechtstreeks bereikt (poort 443 of het LAN)
# en zich voordoet als bezoeker via Cloudflare. Het dashboard telt dat als van buitenaf en meldt het.
map "$homepage_cf_trusted|$http_cf_connecting_ip$http_cf_ipcountry$http_cf_access_jwt_assertion" $homepage_cf_forged {
    "~^0\|." 1;
    default "";
}

# Stond er een slot voor het dashboard? Cloudflare Access stuurt Cf-Access-Jwt-Assertion mee (alleen geloofd van
# Cloudflare of een tunnel), de forward-auth van Authentik in NPM X-authentik-username (alleen van NPM, en niet bij
# vervalste CF-headers). Op een host zonder forward-auth geeft NPM een X-authentik-username van de bezoeker gewoon
# door; het dashboard gebruikt dit alleen voor de veiligheidscheck (en bewaart het pas na een login met 2FA).
map "$homepage_from_npm$homepage_cf_trusted$homepage_cf_forged|$http_cf_access_jwt_assertion|$http_x_authentik_username" $homepage_access {
    "~^11\|[^|]+\|" cloudflare-access;
    "~^1.\|\|[^|]+$" authentik;
    default "";
}
