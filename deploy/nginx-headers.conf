# /etc/nginx/snippets/homepage-headers.conf
# Staat in een apart bestand omdat nginx de add_header-regels van de server niet erft
# in een location die zelf add_header gebruikt.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
