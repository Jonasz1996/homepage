# /etc/nginx/snippets/homepage-tls.conf (install.sh zet het er alleen als er een certificaat is, anders is het leeg)
# Ook https, op poort 443, met het eigen certificaat van install.sh (9999 dagen geldig, in /etc/ssl/homepage). Het
# hoort bij dezelfde server als poort 80: wie er binnen mag, is op allebei hetzelfde.
listen 443 ssl default_server;
listen [::]:443 ssl default_server;
ssl_certificate /etc/ssl/homepage/homepage.crt;
ssl_certificate_key /etc/ssl/homepage/homepage.key;
ssl_protocols TLSv1.2 TLSv1.3;
