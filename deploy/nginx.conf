# /etc/nginx/sites-available/homepage
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Echte client-IP overnemen van Nginx Proxy Manager (wordt door install.sh ingevuld). Daarna is $remote_addr het
    # adres waarvan NPM het verzoek kreeg: het laatste in X-Forwarded-For, dat NPM er zelf achter zette. Niet
    # recursief, want dat kan NPM zelf zijn (cloudflared op de host van NPM, naar het LAN-adres van NPM). De headers
    # van Cloudflare gelooft homepage-map.conf alleen van Cloudflare of een tunnel.
    set_real_ip_from __NPM_IP__;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Alleen via NPM (en vanuit de container zelf); van het LAN alleen push-monitors, webhooks en /api/healthz. Zie
    # $homepage_blocked in homepage-map.conf. Wie rechtstreeks op http://IP komt, krijgt uitleg in plaats van een kale 403.
    if ($homepage_blocked) {
        return 403;
    }
    error_page 403 @geweigerd;
    location @geweigerd {
        default_type text/plain;
        if ($homepage_blocked) {
            return 403 "Rechtstreeks op dit adres werkt het dashboard alleen vanuit de container zelf.
Open het via Nginx Proxy Manager (https). Toch op http://IP testen: zet HOMEPAGE_LAN_OPEN=1 in
/etc/homepage/homepage.env en voer bash /opt/homepage/deploy/install.sh opnieuw uit.
Kom je al via NPM en zie je dit toch, dan klopt HOMEPAGE_NPM_IP in /etc/homepage/homepage.env niet (dit verzoek
kwam van $realip_remote_addr): zet het juiste IP en voer install.sh opnieuw uit in de container.
Een toestel op je LAN met een publiek IPv6-adres buiten het netwerk van de container telt niet als LAN, ook niet
met HOMEPAGE_LAN_OPEN=1: zet zijn netwerk in HOMEPAGE_LAN_NETS in hetzelfde bestand en voer install.sh opnieuw uit.
";
        }
        # Een 403 om een andere reden (bv. een map zonder index.html): de gewone foutpagina.
        return 403;
    }

    root /opt/homepage/frontend/dist;
    index index.html;

    include snippets/homepage-headers.conf;

    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json text/plain;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $homepage_client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Altijd overschrijven, zodat een bezoeker dit niet zelf kan meesturen.
        proxy_set_header X-Country $homepage_country;
        proxy_set_header X-Homepage-Via-Cf $homepage_via_cf;
        proxy_set_header X-Homepage-Access $homepage_access;
        proxy_set_header X-Homepage-Cf-Forged $homepage_cf_forged;
        # Voor de SSH-terminal en live data later (WebSockets).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # Push-monitors en webhooks: het geheime token staat in het adres, dus niet in de logs. Ook niet in de error log:
    # die schrijft bij een herstart van de API ("connect() failed") het hele adres weg. Verder hetzelfde als /api/.
    location ^~ /api/push/ {
        access_log off;
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $homepage_client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Altijd overschrijven, zodat een bezoeker dit niet zelf kan meesturen.
        proxy_set_header X-Country $homepage_country;
        proxy_set_header X-Homepage-Via-Cf $homepage_via_cf;
        proxy_set_header X-Homepage-Access $homepage_access;
        proxy_set_header X-Homepage-Cf-Forged $homepage_cf_forged;
        # Voor de SSH-terminal en live data later (WebSockets).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location ^~ /api/hooks/ {
        access_log off;
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $homepage_client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Altijd overschrijven, zodat een bezoeker dit niet zelf kan meesturen.
        proxy_set_header X-Country $homepage_country;
        proxy_set_header X-Homepage-Via-Cf $homepage_via_cf;
        proxy_set_header X-Homepage-Access $homepage_access;
        proxy_set_header X-Homepage-Cf-Forged $homepage_cf_forged;
        # Voor de SSH-terminal en live data later (WebSockets).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        include snippets/homepage-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include snippets/homepage-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
        include snippets/homepage-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
