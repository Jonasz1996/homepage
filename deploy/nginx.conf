# /etc/nginx/sites-available/homepage
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Echte client-IP overnemen van Nginx Proxy Manager (wordt door install.sh ingevuld).
    set_real_ip_from __NPM_IP__;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /opt/homepage/frontend/dist;
    index index.html;

    include snippets/homepage-headers.conf;

    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json text/plain;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $homepage_client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Altijd overschrijven, zodat een bezoeker dit niet zelf kan meesturen.
        proxy_set_header X-Country $homepage_country;
        proxy_set_header X-Homepage-Via-Cf $homepage_via_cf;
        proxy_set_header X-Homepage-Access $homepage_access;
        # Voor de SSH-terminal en live data later (WebSockets).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        include snippets/homepage-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include snippets/homepage-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
        include snippets/homepage-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
