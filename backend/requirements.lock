# Vaste versies van alle bibliotheken die de backend nodig heeft, ook onrechtstreeks. install.sh bouwt hiermee de venv
# en de CI test ermee: in productie draait wat getest is, en een oudere versie terugzetten geeft ook haar bibliotheken
# terug. Opnieuw maken (na een wijziging in pyproject.toml, of om bij te werken), in de map van de repository:
#   python3.11 -m venv /tmp/lock && /tmp/lock/bin/pip install ./backend
#   /tmp/lock/bin/pip freeze --exclude homepage
# en alles onder deze uitleg vervangen door die uitvoer. Daarna ook requirements-dev.lock (zie daar).
# Elke versie moet installeren op Python 3.11, 3.12 en 3.13 (Debian 12 en 13), op x86_64 en aarch64: een wheel
# voor die versies (manylinux) of pure Python.
